services:
  postgis:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: atlas_local
      POSTGRES_PASSWORD: atlas_local_only
      POSTGRES_DB: atlas_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_local -d atlas_local"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - atlas_pgdata:/var/lib/postgresql

volumes:
  atlas_pgdata:
