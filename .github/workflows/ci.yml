name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: atlas_test
          POSTGRES_PASSWORD: atlas_local_only
          POSTGRES_DB: atlas_lot0
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U atlas_test -d atlas_lot0"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://atlas_test:atlas_local_only@127.0.0.1:55432/atlas_lot0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: |
          echo CONFIG_FORMAT_BEGIN
          pnpm exec prettier playwright.config.ts
          echo CONFIG_FORMAT_END
          echo TEST_FORMAT_BEGIN
          pnpm exec prettier tests/e2e/trip-editor.spec.ts
          echo TEST_FORMAT_END
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter @travel-atlas/database build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm smoke:api
      - run: pnpm smoke:web
        env:
          ATLAS_SMOKE_DISPOSABLE: '1'
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
        env:
          ATLAS_E2E_DISPOSABLE: '1'
