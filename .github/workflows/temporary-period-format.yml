name: Temporary formatting for period consistency
on:
  push:
    branches: [fix/trip-period-consistency-v2]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/src/App.tsx packages/database/src/trip-repository.ts tests/integration/nested-trips.integration.test.ts tests/e2e/trip-editor.spec.ts docs/TRIP_EDITOR.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style(trips): normalize period-consistency patch"
            git push origin HEAD:fix/trip-period-consistency-v2
          fi
