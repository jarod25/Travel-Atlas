name: One-time branch formatting

on:
  push:
    branches:
      - feature/archived-visit-restoration
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/archived-visit-restoration
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/api/src/app.ts apps/web/src/App.tsx packages/database/src/atlas-store.ts packages/database/src/visit-repository.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts apps/web/src/App.tsx packages/database/src/atlas-store.ts packages/database/src/visit-repository.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier formatting"
            git push origin HEAD:feature/archived-visit-restoration
          fi
